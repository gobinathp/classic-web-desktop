name: Feature request
description: Propose a reusable improvement that fits the lightweight classic design.
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include keyboard behavior, memory impact, and whether this should be optional.
    validations:
      required: true
